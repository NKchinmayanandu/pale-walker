function drawSprite(name, dx, dy, dw = TILE_SIZE, dh = TILE_SIZE) {
  const s = ATLAS[name];
  if (!s || !atlasLoaded) return false;
  ctx.drawImage(atlas, s.sx, s.sy, s.sw, s.sh, dx, dy, dw, dh);
  return true;
}

function drawSpriteFit(name, cx, cy, maxW = TILE_SIZE, maxH = TILE_SIZE) {
  const s = ATLAS[name];
  if (!s || !atlasLoaded) return;
  const scale = Math.min(maxW / s.sw, maxH / s.sh);
  const w = s.sw * scale, h = s.sh * scale;
  ctx.drawImage(atlas, s.sx, s.sy, s.sw, s.sh, cx - w / 2, cy - h / 2, w, h);
}

// ============================================================================
// DETERMINISTIC SEEDED PRNG (Mulberry32)
// ============================================================================
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let currentSeed = Math.floor(Math.random() * 900000) + 100000;
let rng = mulberry32(currentSeed);
let bfsDebug = false;

// ============================================================================
// GAME STATE & SYSTEM VARIABLES
// ============================================================================
let g, items = [], P, E, traps = [], blocks = [], seen, over, K = {};
let rooms = [], doors = [], decorations = [], torches = [];
let exitPos = {x: 0, y: 0};
let DR = {x0: 99, y0: 99, x1: -1, y1: -1};

const dark = (x, y) => x >= DR.x0 && x <= DR.x1 && y >= DR.y0 && y <= DR.y1;
const isDecoBlock = (x, y) => decorations.some(d => d.blocking && d.x === x && d.y === y);
const isBlock = (x, y) => blocks.some(b => b.x === x && b.y === y);
const solid = (x, y) => x < 0 || y < 0 || x >= N || y >= N || g[y][x] === 1 || isBlock(x, y) || isDecoBlock(x, y);
const lit = (x, y) => !dark(x, y) || (P.torch && Math.hypot(x - P.fx, y - P.fy) <= 2.6);

function say(t) { msgEl.textContent = t; }

// ============================================================================
// PROCEDURAL DUNGEON GENERATOR
// ============================================================================
function generateRooms() {
  rooms = [];
  // 1. Central Great Hall (5x5)
  const cw = 5, ch = 5;
  const cx = Math.floor((N - cw) / 2), cy = Math.floor((N - ch) / 2);
  rooms.push({x: cx, y: cy, w: cw, h: ch, isHall: true});
  for (let y = cy; y < cy + ch; y++) {
    for (let x = cx; x < cx + cw; x++) g[y][x] = 0;
  }

  // 2. Side rooms
  const targetRooms = 7;
  let attempts = 0;
  while (rooms.length < targetRooms && attempts < 120) {
    attempts++;
    const rw = 3 + Math.floor(rng() * 3); // 3, 4, 5
    const rh = 3 + Math.floor(rng() * 3);
    const rx = 2 + Math.floor(rng() * (N - rw - 3));
    const ry = 2 + Math.floor(rng() * (N - rh - 3));
    let overlap = false;
    for (let r of rooms) {
      if (!(rx + rw + 1 < r.x || rx > r.x + r.w + 1 || ry + rh + 1 < r.y || ry > r.y + r.h + 1)) {
        overlap = true;
        break;
      }
    }
    if (!overlap) {
      const isIrregular = rng() < 0.35;
      rooms.push({x: rx, y: ry, w: rw, h: rh, isHall: false, isIrregular});
      for (let y = ry; y < ry + rh; y++) {
        for (let x = rx; x < rx + rw; x++) g[y][x] = 0;
      }
      if (isIrregular && rx + rw + 2 < N - 1 && ry + rh + 2 < N - 1) {
        // Add attached alcove
        for (let y = ry + 1; y < ry + 3; y++) {
          for (let x = rx + rw; x < rx + rw + 2; x++) {
            if (x < N - 1 && y < N - 1) g[y][x] = 0;
          }
        }
      }
    }
  }
}

function connectRooms() {
  for (let i = 0; i < rooms.length; i++) {
    const r1 = rooms[i];
    const r2 = rooms[(i + 1) % rooms.length];
    const x1 = r1.x + Math.floor(r1.w / 2), y1 = r1.y + Math.floor(r1.h / 2);
    const x2 = r2.x + Math.floor(r2.w / 2), y2 = r2.y + Math.floor(r2.h / 2);
    if (rng() < 0.5) {
      for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) g[y1][x] = 0;
      for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) g[y][x2] = 0;
    } else {
      for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) g[y][x1] = 0;
      for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) g[y2][x] = 0;
    }
  }
  // Extra connections to central hall for loop connectivity
  const hall = rooms[0];
  for (let i = 1; i < rooms.length; i++) {
    if (rng() < 0.45) {
      const r = rooms[i];
      const x1 = r.x + Math.floor(r.w / 2), y1 = r.y + Math.floor(r.h / 2);
      const x2 = hall.x + Math.floor(hall.w / 2), y2 = hall.y + Math.floor(hall.h / 2);
      for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) g[y1][x] = 0;
      for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) g[y][x2] = 0;
    }
  }
  // Outer perimeter must always be walls
  for (let i = 0; i < N; i++) {
    g[0][i] = 1; g[N - 1][i] = 1; g[i][0] = 1; g[i][N - 1] = 1;
  }
}

function placeDoors() {
  doors = [];
  for (let r of rooms) {
    for (let x = r.x; x < r.x + r.w; x++) {
      if (r.y > 1 && g[r.y - 1][x] === 0 && g[r.y][x] === 0 && !doors.some(d => d.x === x && d.y === r.y)) {
        doors.push({x, y: r.y, open: rng() < 0.35, type: 'door_wood'});
      }
      if (r.y + r.h < N - 1 && g[r.y + r.h][x] === 0 && g[r.y + r.h - 1][x] === 0 && !doors.some(d => d.x === x && d.y === r.y + r.h - 1)) {
        doors.push({x, y: r.y + r.h - 1, open: rng() < 0.35, type: 'door_wood'});
      }
    }
  }
}

function placeTorches() {
  torches = [];
  let id = 0;
  // Wall torches on south-facing walls
  for (let y = 1; y < N - 2; y++) {
    for (let x = 1; x < N - 1; x++) {
      if (g[y][x] === 1 && g[y + 1][x] === 0) {
        if (rng() < 0.14) {
          torches.push({x, y, type: 'torch', id: id++});
        }
      }
    }
  }
  // Standing braziers in great hall corners
  const hall = rooms[0];
  torches.push({x: hall.x + 1, y: hall.y + 1, type: 'brazier', id: id++});
  torches.push({x: hall.x + hall.w - 2, y: hall.y + 1, type: 'brazier', id: id++});
  torches.push({x: hall.x + 1, y: hall.y + hall.h - 2, type: 'brazier', id: id++});
  torches.push({x: hall.x + hall.w - 2, y: hall.y + hall.h - 2, type: 'brazier', id: id++});
}

function placeDecorations() {
  decorations = [];
  const nonBlocking = ['bones', 'skull_crossbones', 'blood_pool', 'moss_patch', 'floor_cracks', 'slime_puddle'];
  const blocking = ['crate_1', 'crate_2', 'barrel_1', 'chest_closed'];
  
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      if (g[y][x] === 0) {
        if (rng() < 0.05) {
          const sprite = nonBlocking[Math.floor(rng() * nonBlocking.length)];
          decorations.push({x, y, sprite, blocking: false});
        } else if (rng() < 0.02) {
          let wallCount = 0;
          for (let d = 0; d < 4; d++) if (g[y + DY[d]][x + DX[d]] === 1) wallCount++;
          if (wallCount >= 2) {
            const sprite = blocking[Math.floor(rng() * blocking.length)];
            decorations.push({x, y, sprite, blocking: true});
          }
        }
      }
    }
  }
}

function validateDungeon() {
  // BFS connectivity test from player to exit and enemy
  const res = bfs(P.cx, P.cy, E.cx, E.cy);
  return res !== null && E.path && E.path.length > 0;
}

function generateDungeon() {
  g = Array.from({length: N}, () => Array(N).fill(1));
  generateRooms();
  connectRooms();
  placeDoors();
  placeTorches();
  placeDecorations();
}

function reach() {
  const R = {};
  const k0 = P.cx + ',' + P.cy;
  R[k0] = 0;
  const q = [[P.cx, P.cy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d], k = nx + ',' + ny;
      if (k in R || nx < 0 || ny < 0 || nx >= N || ny >= N || g[ny][nx] === 1 || isDecoBlock(nx, ny) || dark(nx, ny)) continue;
      R[k] = R[x + ',' + y] + 1;
      q.push([nx, ny]);
    }
  }
  return R;
}

function pickDark() {
  let w, h, x0, y0;
  do {
    const a = Math.ceil(N / 2), b = a - 1;
    w = rng() < 0.5 ? a : b;
    h = w === a ? b : a;
    x0 = Math.floor(rng() * (N - w + 1));
    y0 = Math.floor(rng() * (N - h + 1));
  } while (Math.hypot(x0 - P.cx, y0 - P.cy) < 7);
  DR = {x0, y0, x1: x0 + w - 1, y1: y0 + h - 1};
}

function init() {
  currentSeed = Math.floor(Math.random() * 900000) + 100000;
  rng = mulberry32(currentSeed);
  let R, lc;
  for (;;) {
    generateDungeon();
    // Player starts in room 1
    const pRoom = rooms[1] || rooms[0];
    P = {cx: pRoom.x + 1, cy: pRoom.y + 1, fx: pRoom.x + 1, fy: pRoom.y + 1, tx: pRoom.x + 1, ty: pRoom.y + 1, mv: false, dir: 2, keys: 0, torch: false, stun: 0, block: 0, adr: 0, sprintT: 0, sprintCD: 0};
    
    // Exit in farthest room
    let maxDist = -1, bestRoom = rooms[rooms.length - 1];
    for (let r of rooms) {
      const dist = Math.hypot(r.x - P.cx, r.y - P.cy);
      if (dist > maxDist) { maxDist = dist; bestRoom = r; }
    }
    exitPos = {x: bestRoom.x + Math.floor(bestRoom.w / 2), y: bestRoom.y + Math.floor(bestRoom.h / 2)};
    g[exitPos.y][exitPos.x] = 2;

    // Enemy in distant room
    const eRoom = rooms.length > 3 ? rooms[rooms.length - 2] : bestRoom;
    E = {cx: eRoom.x + 1, cy: eRoom.y + 1, fx: eRoom.x + 1, fy: eRoom.y + 1, tx: eRoom.x + 1, ty: eRoom.y + 1, mv: false, st: 'idle', t: 0, path: []};

    pickDark();
    R = reach();
    lc = Object.keys(R).filter(k => R[k] > 0);
    if (lc.length >= 10 && validateDungeon()) break;
  }

  over = null; traps = []; blocks = []; items = [];
  seen = Array.from({length: N}, () => Array(N).fill(false));
  seen[exitPos.y][exitPos.x] = true;

  const used = new Set([P.cx + ',' + P.cy, exitPos.x + ',' + exitPos.y, E.cx + ',' + E.cy]);
  const pick = (d) => {
    let x, y, k, tries = 0;
    do {
      if (d) {
        x = 2 + Math.floor(rng() * (N - 4));
        y = 2 + Math.floor(rng() * (N - 4));
      } else {
        const c = lc[Math.floor(rng() * lc.length)].split(',').map(Number);
        x = c[0]; y = c[1];
      }
      k = x + ',' + y;
      tries++;
    } while ((used.has(k) || dark(x, y) !== d || g[y][x] !== 0 || isDecoBlock(x, y)) && tries < 200);
    used.add(k);
    return {x, y};
  };

  // Torch near spawn
  const near = lc.filter(k => R[k] >= 2 && R[k] <= 8 && !used.has(k));
  const tk = (near.length ? near[Math.floor(rng() * near.length)] : lc[0]).split(',').map(Number);
  used.add(tk.join(','));
  items.push({x: tk[0], y: tk[1], type: 'torch'});

  // Keys: 2 in lit, 1 in dark
  [0, 0, 1].forEach(d => items.push({...pick(!!d), type: 'key'}));
  [['stun', 0], ['stun', 1], ['block', 0], ['block', 1], ['map', 0]].forEach(([t, d]) => items.push({...pick(!!d), type: t}));
  say('Grab the torch, find 3 keys, reach the EXIT stairs.');
}

// ============================================================================
// WALL AUTOTILING & FLOOR VARIATION
// ============================================================================
function isW(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return true;
  return g[gy][gx] === 1;
}

function isFloor(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return false;
  return g[y][x] === 0 || g[y][x] === 2;
}

function getWallType(x, y) {
  const f_u = isFloor(x, y - 1), f_d = isFloor(x, y + 1);
  const f_l = isFloor(x - 1, y), f_r = isFloor(x + 1, y);
  const f_ul = isFloor(x - 1, y - 1), f_ur = isFloor(x + 1, y - 1);
  const f_dl = isFloor(x - 1, y + 1), f_dr = isFloor(x + 1, y + 1);

  // 1. Outer room corners bordering open floors
  if ((f_dr && !f_u && !f_l) || (f_d && f_r && !f_u && !f_l)) return 'wall_corner_tl';
  if ((f_dl && !f_u && !f_r) || (f_d && f_l && !f_u && !f_r)) return 'wall_corner_tr';
  if ((f_ur && !f_d && !f_l) || (f_u && f_r && !f_d && !f_l)) return 'wall_corner_bl';
  if ((f_ul && !f_d && !f_r) || (f_u && f_l && !f_d && !f_r)) return 'wall_corner_br';

  // 2. Straight wall edges bordering rooms/corridors
  if (f_d && !f_u) return 'wall_top_horiz';
  if (f_u && !f_d) return 'wall_bot_horiz';
  if (f_r && !f_l) return 'wall_left_vert';
  if (f_l && !f_r) return 'wall_right_vert';

  // 3. Inner corners / T-junctions
  if (!isW(x, y + 1) && isW(x, y - 1)) return 'wall_top_horiz';
  if (!isW(x + 1, y) && isW(x - 1, y)) return 'wall_left_vert';

  // 4. Solid brick fill with mossy and cracked accents
  const h = (x * 19 + y * 29 + currentSeed) % 100;
  if (h < 10) return 'wall_moss_horiz';
  if (h < 20) return 'wall_crack_horiz';
  return 'wall_solid';
}

function getFloorVariant(x, y) {
  // Check if cell is in a 2x2 grand stone slab
  for (let r of rooms) {
    if (r.w >= 4 && r.h >= 4) {
      const cx = r.x + Math.floor((r.w - 2) / 2);
      const cy = r.y + Math.floor((r.h - 2) / 2);
      if (x === cx && y === cy) return 'floor_slab_tl';
      if (x === cx + 1 && y === cy) return 'floor_slab_tr';
      if (x === cx && y === cy + 1) return 'floor_slab_bl';
      if (x === cx + 1 && y === cy + 1) return 'floor_slab_br';
    }
  }

  // Weighted random selection based on deterministic coordinate hash
  const hash = (x * 73 + y * 97 + currentSeed * 13) % 100;
  if (hash < 70) {
    // 70% normal stone
    return 'floor_norm_' + ((x + y * 2) % 4);
  } else if (hash < 85) {
    // 15% cracked stone
    return hash % 2 === 0 ? 'floor_crack_0' : 'floor_crack_1';
  } else if (hash < 92) {
    // 7% heavily cracked
    return 'floor_heavy_crack';
  } else if (hash < 97) {
    // 5% mossy stone
    return hash % 2 === 0 ? 'floor_moss_0' : 'floor_moss_1';
  } else {
    // 3% damaged / rubble
    return 'floor_rubble';
  }
}

// ============================================================================
// BFS PATHFINDING WITH FULL PATH TRACKING
// ============================================================================
function bfs(sx, sy, tx, ty) {
  const prev = {}, q = [[sx, sy]];
  prev[sx + ',' + sy] = null;
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d], k = nx + ',' + ny;
      if (k in prev || solid(nx, ny)) continue;
      prev[k] = [x, y];
      q.push([nx, ny]);
    }
  }
  const tk = tx + ',' + ty;
  if (!(tk in prev)) {
    E.path = [];
    return null;
  }
  let c = [tx, ty], path = [];
  while (c && (c[0] !== sx || c[1] !== sy)) {
    path.unshift(c);
    c = prev[c[0] + ',' + c[1]];
  }
  E.path = path;
  return path[0] ? {x: path[0][0], y: path[0][1]} : null;
}

function step(e, sp, dt) {
  const dx = e.tx - e.fx, dy = e.ty - e.fy, dist = Math.hypot(dx, dy), d = sp * dt;
  if (d >= dist) { e.fx = e.tx; e.fy = e.ty; e.cx = e.tx; e.cy = e.ty; e.mv = false; return true; }
  e.fx += dx / dist * d; e.fy += dy / dist * d; return false;
}

function canEnter(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N || g[y][x] === 1 || isBlock(x, y) || isDecoBlock(x, y)) return false;
  if (dark(x, y) && !P.torch) say('Pitch black. You are blind without the torch.');
  if (g[y][x] === 2 && P.keys < 3) { say('Gate locked. Need 3 keys (' + P.keys + '/3).'); return false; }
  return true;
}

function sees() {
  let x = Math.round(P.fx), y = Math.round(P.fy);
  for (let i = 0; i < 10; i++) {
    x += DX[P.dir]; y += DY[P.dir];
    if (solid(x, y)) return false;
    if (Math.round(E.fx) === x && Math.round(E.fy) === y) return lit(x, y);
  }
  return false;
}

function pickup() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.x !== P.cx || it.y !== P.cy) continue;
    items.splice(i, 1);
    if (it.type === 'key') {
      P.keys++;
      say('Key ' + P.keys + '/3');
      if (E.st === 'idle') { E.st = 'stalk'; say('Key ' + P.keys + '/3 — something woke up...'); }
    } else if (it.type === 'torch') {
      P.torch = true; say('Torch acquired. You can enter the dark zone.');
    } else if (it.type === 'stun') {
      P.stun++; say('Stun shot +1 (face it, press 1)');
    } else if (it.type === 'block') {
      P.block++; say('Block +1 (press 2)');
    } else if (it.type === 'map') {
      seen.forEach(r => r.fill(true)); say('Map: dungeon revealed.');
    }
  }
}

function arriveP() {
  if (mode === 'abs') pickup();
  // Open any closed wooden door on arrival
  const door = doors.find(d => d.x === P.cx && d.y === P.cy && !d.open);
  if (door) { door.open = true; }
  if (g[P.cy][P.cx] === 2) over = 'win';
}

let mode = 'abs', held = [];
const AB = {up: 0, right: 1, down: 2, left: 3};

function setMode(m) {
  mode = m; held = []; K = {};
  if (m === 'abs' && !P.mv) pickup();
  const b = document.querySelector('[data-k=mode]');
  if (b) b.textContent = 'View: ' + (m === 'abs' ? '2D' : '3D');
  say(m === 'abs' ? '2D view: arrows move on screen, items auto-pickup.' : '3D view: ◀▶ turn, ▲ forward, ▼ back, E to pick up.');
}

function zap() {
  if (E.st === 'idle' || E.st === 'stun') return false;
  let x = Math.round(P.fx), y = Math.round(P.fy);
  for (let i = 0; i < 10; i++) {
    x += DX[P.dir]; y += DY[P.dir];
    if (solid(x, y)) return false;
    if (Math.round(E.fx) === x && Math.round(E.fy) === y) {
      E.st = 'stun'; E.t = 3.5; P.zapT = 0.3;
      say('Direct hit — it is stunned!');
      return true;
    }
  }
  return false;
}

function press(k) {
  if (k === 'restart') { init(); return; }
  if (k === 'mode') { setMode(mode === 'abs' ? 'rel' : 'abs'); return; }
  if (k === 'debug') {
    bfsDebug = !bfsDebug;
    const b = document.querySelector('[data-k=debug]');
    if (b) { b.textContent = 'BFS: ' + (bfsDebug ? 'ON' : 'OFF'); b.classList.toggle('active', bfsDebug); }
    say('BFS Debug: ' + (bfsDebug ? 'ON' : 'OFF'));
    return;
  }
  if (over) return;
  if (k === 'use') { if (!P.mv) pickup(); return; }
  if (mode === 'abs' && k in AB) { held = held.filter(h => h !== k); held.push(k); return; }
  if (k === 'left') P.dir = (P.dir + 3) % 4;
  else if (k === 'right') P.dir = (P.dir + 1) % 4;
  else if (k === 'snap') P.dir = (P.dir + 2) % 4;
  else if (k === 'sprint') { if (P.sprintCD <= 0) { P.sprintT = 1.5; P.sprintCD = 7; } }
  else if (k === 'stun') { if (P.stun > 0) { if (zap()) P.stun--; else say('No target in line (10 tiles).'); } }
  else if (k === 'block') {
    const bx = P.mv ? P.cx : P.cx - DX[P.dir], by = P.mv ? P.cy : P.cy - DY[P.dir];
    const nearE = [[E.cx, E.cy], [E.tx, E.ty]].some(([a, b]) => a === bx && b === by);
    if (P.block > 0 && !solid(bx, by) && !nearE && g[by][bx] === 0) {
      P.block--; blocks.push({x: bx, y: by, t: 15});
    }
  } else K[k] = 1;
}

function release(k) { delete K[k]; held = held.filter(h => h !== k); }

function update(dt) {
  if (over) return;
  P.adr = Math.max(0, P.adr - dt);
  P.zapT = Math.max(0, (P.zapT || 0) - dt);
  P.sprintT = Math.max(0, P.sprintT - dt);
  P.sprintCD = Math.max(0, P.sprintCD - dt);
  blocks.forEach(b => b.t -= dt);
  blocks = blocks.filter(b => b.t > 0);

  // Player movement
  if (!P.mv) {
    let d = -1;
    if (mode === 'abs') { if (held.length) { d = AB[held[held.length - 1]]; P.dir = d; } }
    else if (K.up || K.down) d = K.up ? P.dir : (P.dir + 2) % 4;
    if (d >= 0) {
      const nx = P.cx + DX[d], ny = P.cy + DY[d];
      if (canEnter(nx, ny)) { P.tx = nx; P.ty = ny; P.mv = true; }
    }
  }
  if (P.mv) {
    const sp = V * ((P.adr > 0 || P.sprintT > 0) ? 1.5 : 1);
    if (step(P, sp, dt)) arriveP();
  }

  // Fog of war memory update
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (lit(x, y) && Math.hypot(x - P.fx, y - P.fy) <= (dark(x, y) ? 2.6 : 6)) {
        seen[y][x] = true;
      }
    }
  }

  updE(dt);
  if ((E.st === 'stalk' || E.st === 'chase') && Math.hypot(E.fx - P.fx, E.fy - P.fy) < 0.6) over = 'dead';
}

function updE(dt) {
  if (E.st === 'idle') return;
  if (E.st === 'windup') {
    E.t -= dt;
    if (E.t <= 0) { E.st = 'chase'; say('IT IS HUNTING YOU!'); }
    return;
  }
  if (E.st === 'stun') {
    E.t -= dt;
    if (E.t <= 0) { E.st = 'stalk'; say('It recovers and stalks again...'); }
    return;
  }
  if (E.st === 'stalk' && sees()) {
    E.st = 'windup'; E.t = 5; P.adr = 5;
    say('IT SEES YOU — RUN! (adrenaline)');
    return;
  }
  if (!E.mv) {
    const n = bfs(E.cx, E.cy, Math.round(P.fx), Math.round(P.fy));
    if (!n) {
      if (E.st === 'chase') { E.st = 'stalk'; say('Path blocked. It lost you... stalking.'); }
      return;
    }
    E.tx = n.x; E.ty = n.y; E.mv = true;
  }
  if (step(E, V * (E.st === 'chase' ? 1.1 : 0.6), dt)) {
    const i = traps.findIndex(t => t.x === E.cx && t.y === E.cy);
    if (i >= 0) {
      traps.splice(i, 1);
      E.st = 'stun'; E.t = 3.5;
      say('It stepped on the trap — stunned!');
    }
  }
}

// ============================================================================
// 2D RENDERING PIPELINE (14-STEP ARCHITECTURE)
// ============================================================================
function drawFloor() {
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!seen[y][x] || (dark(x, y) && !P.torch)) continue;
      if (g[y][x] === 0 || g[y][x] === 2) {
        const sprite = getFloorVariant(x, y);
        drawSprite(sprite, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
    }
  }
}

function drawWalls() {
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!seen[y][x] || (dark(x, y) && !P.torch)) continue;
      if (g[y][x] === 1) {
        const sprite = getWallType(x, y);
        drawSprite(sprite, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
    }
  }
}

function drawWallDepth() {
  // Cast subtle depth shading beneath south-facing walls onto the floor directly below
  ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
  for (let y = 0; y < N - 1; y++) {
    for (let x = 0; x < N; x++) {
      if (g[y][x] === 1 && (g[y + 1][x] === 0 || g[y + 1][x] === 2)) {
        if (seen[y + 1][x] && (!dark(x, y + 1) || P.torch)) {
          ctx.fillRect(x * TILE_SIZE, (y + 1) * TILE_SIZE, TILE_SIZE, 5);
        }
      }
    }
  }
}

function drawDoors() {
  for (let d of doors) {
    if (!seen[d.y][d.x] || (dark(d.x, d.y) && !P.torch)) continue;
    const sprite = d.open ? 'door_wood_open' : 'door_wood_closed';
    drawSprite(sprite, d.x * TILE_SIZE, d.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
  }
}

function drawDecorations() {
  for (let d of decorations) {
    if (!seen[d.y][d.x] || (dark(d.x, d.y) && !P.torch)) continue;
    drawSpriteFit(d.sprite, d.x * TILE_SIZE + TILE_SIZE / 2, d.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE * 0.9, TILE_SIZE * 0.9);
  }
  // Barricade blocks
  blocks.forEach(b => {
    if (seen[b.y][b.x]) {
      drawSpriteFit('crate_1', b.x * TILE_SIZE + TILE_SIZE / 2, b.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE * 0.85, TILE_SIZE * 0.85);
    }
  });
}

function drawTorches(tm) {
  for (let t of torches) {
    if (!seen[t.y][t.x] || (dark(t.x, t.y) && !P.torch)) continue;
    if (t.type === 'torch') {
      const frame = 1 + Math.floor((tm / 160 + t.id * 1.3) % 3);
      drawSpriteFit('torch_lit_' + frame, t.x * TILE_SIZE + TILE_SIZE / 2, t.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE * 0.8, TILE_SIZE * 0.95);
    } else {
      const frame = 1 + Math.floor((tm / 180 + t.id * 1.5) % 2);
      drawSpriteFit('brazier_' + frame, t.x * TILE_SIZE + TILE_SIZE / 2, t.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE * 0.85, TILE_SIZE * 0.95);
    }
  }
}

function drawExit(tm) {
  if (!seen[exitPos.y][exitPos.x]) return;
  const ex = exitPos.x * TILE_SIZE, ey = exitPos.y * TILE_SIZE;
  drawSprite('stairs_down', ex, ey, TILE_SIZE, TILE_SIZE);

  // Pulsing exit beacon
  const isOpen = P.keys >= 3;
  const pulse = 0.25 + 0.15 * Math.sin(tm / 200);
  const cx = ex + TILE_SIZE / 2, cy = ey + TILE_SIZE / 2;
  const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 26);
  if (isOpen) {
    grad.addColorStop(0, 'rgba(255, 215, 60, ' + (pulse + 0.2) + ')');
    grad.addColorStop(0.6, 'rgba(255, 170, 30, ' + pulse + ')');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  } else {
    grad.addColorStop(0, 'rgba(220, 60, 40, ' + (pulse + 0.15) + ')');
    grad.addColorStop(0.6, 'rgba(160, 20, 20, ' + pulse + ')');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  }
  ctx.save();
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawLighting(tm) {
  lightCtx.setTransform(1, 0, 0, 1, 0, 0);
  lightCtx.fillStyle = 'rgba(5, 7, 10, 0.94)';
  lightCtx.fillRect(0, 0, W, W);

  lightCtx.globalCompositeOperation = 'destination-out';

  // 1. Torches dynamic point lights
  for (let t of torches) {
    const flicker = Math.sin(tm * 0.006 + t.id * 2.3) * 0.08 + Math.cos(tm * 0.013 + t.id * 3.7) * 0.05;
    const radius = TILE_SIZE * (3.6 + flicker * 0.9);
    const tx = t.x * TILE_SIZE + TILE_SIZE / 2, ty = t.y * TILE_SIZE + TILE_SIZE / 2;
    const grad = lightCtx.createRadialGradient(tx, ty, 6, tx, ty, radius);
    grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
    grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.85)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    lightCtx.fillStyle = grad;
    lightCtx.beginPath();
    lightCtx.arc(tx, ty, radius, 0, Math.PI * 2);
    lightCtx.fill();

    // Reveal visited cells within torch radius
    const cellR = Math.ceil(radius / TILE_SIZE);
    for (let dy = -cellR; dy <= cellR; dy++) {
      for (let dx = -cellR; dx <= cellR; dx++) {
        const nx = t.x + dx, ny = t.y + dy;
        if (nx >= 0 && ny >= 0 && nx < N && ny < N && Math.hypot(dx, dy) <= radius / TILE_SIZE) {
          seen[ny][nx] = true;
        }
      }
    }
  }

  // 2. Player vision light
  const pRadius = P.torch ? TILE_SIZE * 5.4 : (dark(P.cx, P.cy) ? TILE_SIZE * 1.6 : TILE_SIZE * 3.4);
  const px = P.fx * TILE_SIZE + TILE_SIZE / 2, py = P.fy * TILE_SIZE + TILE_SIZE / 2;
  const pGrad = lightCtx.createRadialGradient(px, py, 6, px, py, pRadius);
  pGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
  pGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.85)');
  pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  lightCtx.fillStyle = pGrad;
  lightCtx.beginPath();
  lightCtx.arc(px, py, pRadius, 0, Math.PI * 2);
  lightCtx.fill();

  // 3. Fog of war: previously seen cells remain partially visible (fog memory)
  lightCtx.fillStyle = 'rgba(0, 0, 0, 0.48)';
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (seen[y][x] && (!dark(x, y) || P.torch)) {
        lightCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Draw lighting/fog canvas onto scene
  ctx.drawImage(lightCanvas, 0, 0);

  // 4. Additive warm torch light tint
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let t of torches) {
    if (!seen[t.y][t.x]) continue;
    const tx = t.x * TILE_SIZE + TILE_SIZE / 2, ty = t.y * TILE_SIZE + TILE_SIZE / 2;
    const r = TILE_SIZE * 3.2;
    const tint = ctx.createRadialGradient(tx, ty, 4, tx, ty, r);
    tint.addColorStop(0, 'rgba(255, 175, 55, 0.26)');
    tint.addColorStop(0.5, 'rgba(220, 110, 25, 0.12)');
    tint.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.arc(tx, ty, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawItems(tm) {
  const itemIcons = {
    key: 'key_gold',
    torch: 'torch_lit_2',
    stun: 'crystal_cyan',
    block: 'crate_1',
    map: 'crystal_purple'
  };
  items.forEach(it => {
    if (!lit(it.x, it.y) || Math.hypot(it.x - P.fx, it.y - P.fy) > 3.6) return;
    const cx = it.x * TILE_SIZE + TILE_SIZE / 2, cy = it.y * TILE_SIZE + TILE_SIZE / 2;
    const bob = Math.sin(tm / 180 + it.x) * 2;
    // Item aura
    ctx.fillStyle = 'rgba(255, 220, 80, ' + (0.2 + 0.1 * Math.sin(tm / 180)) + ')';
    ctx.beginPath();
    ctx.arc(cx, cy + bob, 14, 0, Math.PI * 2);
    ctx.fill();
    drawSpriteFit(itemIcons[it.type] || 'crystal_cyan', cx, cy + bob, TILE_SIZE * 0.8, TILE_SIZE * 0.8);
  });
}

function drawPlayer() {
  const pcx = P.fx * TILE_SIZE + TILE_SIZE / 2, pcy = P.fy * TILE_SIZE + TILE_SIZE / 2;
  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.ellipse(pcx, pcy + 10, 13 * 1.2, 13 * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(pcx, pcy);
  // Head
  ctx.fillStyle = '#e8d9c1';
  ctx.beginPath();
  ctx.arc(0, -4, 9, 0, Math.PI * 2);
  ctx.fill();
  // Body (color shifts if adrenaline active)
  ctx.fillStyle = P.adr > 0 ? '#e8742f' : '#b7463d';
  ctx.fillRect(-9, 2, 18, 10);
  ctx.fillStyle = '#f6eee0';
  ctx.fillRect(-12, -1, 5, 10);
  ctx.fillRect(7, -1, 5, 10);
  ctx.fillStyle = '#35251e';
  ctx.fillRect(-5, -9, 10, 4);

  // Direction pointer cone
  ctx.rotate(P.dir * Math.PI / 2);
  ctx.fillStyle = '#7fe3ff';
  ctx.beginPath();
  ctx.moveTo(0, -21);
  ctx.lineTo(5, -15);
  ctx.lineTo(-5, -15);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawEnemy() {
  if (!lit(Math.round(E.fx), Math.round(E.fy))) return;
  const ex = E.fx * TILE_SIZE + TILE_SIZE / 2, ey = E.fy * TILE_SIZE + TILE_SIZE / 2;
  const rage = E.st === 'chase' || E.st === 'windup';
  const sh = E.st === 'windup' ? (Math.random() - 0.5) * 3 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.ellipse(ex, ey + 10, 16 * 1.2, 16 * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(ex + sh, ey);
  const bc = rage ? '#ff6a5a' : (E.st === 'stun' ? '#8ab4c0' : '#6ee7d9');
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = bc;
  ctx.beginPath();
  ctx.arc(0, 0, 21, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = bc;
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rage ? '#2a0505' : '#0a2222';
  ctx.beginPath();
  ctx.arc(-5, -2, 3, 0, Math.PI * 2);
  ctx.arc(5, -2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rage ? '#ffd0c8' : '#b7fff2';
  ctx.fillRect(-8, 7, 16, 3);
  ctx.restore();
}

function drawEffects(tm) {
  // Stun zap screen flash
  if (P.zapT > 0) {
    ctx.fillStyle = 'rgba(80, 225, 255, ' + P.zapT + ')';
    ctx.fillRect(0, 0, W, W);
  }

  // Traps
  traps.forEach(t => {
    if (lit(t.x, t.y)) {
      ctx.strokeStyle = '#4de0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x * TILE_SIZE + TILE_SIZE / 2, t.y * TILE_SIZE + TILE_SIZE / 2, 9, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  // BFS DEBUG PATH VISUALIZATION
  if (bfsDebug && E.path && E.path.length > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(77, 224, 255, 0.75)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(E.fx * TILE_SIZE + TILE_SIZE / 2, E.fy * TILE_SIZE + TILE_SIZE / 2);
    for (let p of E.path) {
      ctx.lineTo(p[0] * TILE_SIZE + TILE_SIZE / 2, p[1] * TILE_SIZE + TILE_SIZE / 2);
    }
    ctx.lineTo(P.fx * TILE_SIZE + TILE_SIZE / 2, P.fy * TILE_SIZE + TILE_SIZE / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Glowing nodes along the BFS path
    for (let i = 0; i < E.path.length; i++) {
      const p = E.path[i];
      const pulse = 3 + Math.sin(tm * 0.008 + i * 0.4) * 1.5;
      ctx.fillStyle = 'rgba(77, 224, 255, 0.9)';
      ctx.beginPath();
      ctx.arc(p[0] * TILE_SIZE + TILE_SIZE / 2, p[1] * TILE_SIZE + TILE_SIZE / 2, pulse, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function draw2d() {
  const tm = performance.now();
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // 1. Base dark background
  ctx.fillStyle = '#06080a';
  ctx.fillRect(0, 0, W, W);

  // 2. Floor tiles
  drawFloor();

  // 3. Wall tiles
  drawWalls();

  // 4. Wall depth/caps
  drawWallDepth();

  // 5. Doors
  drawDoors();

  // 6. Static decorations & blocks
  drawDecorations();

  // 7. Torches & Braziers
  drawTorches(tm);

  // 8. Exit
  drawExit(tm);

  // 9. Dynamic Torch Lighting & Fog Mask
  drawLighting(tm);

  // 10. Items
  drawItems(tm);

  // 11. Player
  drawPlayer();

  // 12. Enemy
  drawEnemy();

  // 13. Particles & Effects (Stun flash, BFS path debug)
  drawEffects(tm);

  // 14. HUD & overlay
  tail();
}

function tail() {
  if (over) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, W, W);
    const bw = W * 0.78, bh = W * 0.3, bx = (W - bw) / 2, by = (W - bh) / 2;
    ctx.fillStyle = '#0a1012';
    ctx.strokeStyle = '#80969b';
    ctx.lineWidth = 2;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = 'center';
    ctx.fillStyle = over === 'win' ? '#ffd45c' : '#ff6a5a';
    ctx.font = '900 ' + (W * 0.05) + 'px system-ui,sans-serif';
    ctx.fillText(over === 'win' ? 'YOU ESCAPED!' : 'THE HUNTER CAUGHT YOU', W / 2, by + bh * 0.4);
    ctx.fillStyle = '#b9c5c7';
    ctx.font = (W * 0.03) + 'px system-ui,sans-serif';
    ctx.fillText(over === 'win' ? 'The ancient dungeon could not hold you.' : 'It tracked your route through the corridors.', W / 2, by + bh * 0.62);
    ctx.fillStyle = '#d9a441';
    ctx.fillText('Press R or tap Restart', W / 2, by + bh * 0.84);
    ctx.restore();
  }
  hud.innerHTML = 'Keys ' + P.keys + '/3 · Torch ' + (P.torch ? '✓' : '✗') + ' · Stun ' + P.stun + ' · Block ' + P.block + ' · Sprint ' + (P.sprintCD > 0 ? P.sprintCD.toFixed(0) + 's' : 'ready') + ' · 096: ' + E.st.toUpperCase() + (bfsDebug ? ' · <span style="color:#4de0ff">[BFS ON]</span>' : '') + ' · Seed #' + currentSeed;
}

// ---------- 3D raycaster view (shares all game state with 2D) ----------
const RW=186,buf=new Uint32Array(RW*RW),zb=new Float32Array(RW),oc=document.createElement('canvas');
oc.width=oc.height=RW;
const octx=oc.getContext('2d'),img=new ImageData(new Uint8ClampedArray(buf.buffer),RW,RW);
let camA=null,DT=.016;
const px=(r,g,b)=>0xFF000000|(b<<16)|(g<<8)|r;
const lightAt=(x,y,d)=>dark(x,y)?(P.torch?Math.pow(Math.max(0,1-d/3.6),1.2):0):Math.max(.45,1-d/16);
function wallRGB(mx,my,u,v){
  const gt=(mx>=0&&my>=0&&mx<N&&my<N)?g[my][mx]:1,st=((v*6)|0)%2;
  if(gt===2)return P.keys>=3?[50,190+st*30,90]:[185+st*35,45,40];
  if(isBlock(mx,my))return[125,82,44];
  let c=dark(mx,my)?[100,84,32]:[100,106,42];
  if(v*5%1<.07||(u*3+((v*5)|0)*.5)%1<.05)c=c.map(a=>a*.62);
  return c;
}
function draw3d(){
  const tgt=(P.dir-1)*Math.PI/2;if(camA===null)camA=tgt;
  const df=((tgt-camA+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;camA+=df*Math.min(1,DT*14);
  const dx=Math.cos(camA),dy=Math.sin(camA),plx=-dy*.7,ply=dx*.7,ox=P.fx+.5,oy=P.fy+.5,h=RW/2;
  // floor + ceiling/sky
  for(let y=0;y<RW;y++){
    const p=y-h,rd=h/(Math.abs(p)+.5),fl=p>=0,t=y/h;
    for(let x=0;x<RW;x++){
      const cx=2*x/RW-1,rx=dx+plx*cx,ry=dy+ply*cx,fx=ox+rd*rx,fy=oy+rd*ry,ix=Math.floor(fx),iy=Math.floor(fy),dk=dark(ix,iy);
      if(!fl&&!dk){buf[y*RW+x]=px(45+120*t,115+100*t,215+30*t);continue}
      const L=lightAt(ix,iy,rd*Math.hypot(rx,ry)),gr=(fx-ix<.05||fy-iy<.05),k=gr?.65:1,ck=(ix+iy)&1;
      let r,gg,b;
      if(!fl){r=80;gg=66;b=30}
      else if(dk){r=ck?165:148;gg=ck?138:122;b=ck?52:44}
      else{r=ck?60:52;gg=ck?172:156;b=ck?66:58}
      buf[y*RW+x]=px(r*k*L,gg*k*L,b*k*L);
    }
  }
  // walls (DDA)
  for(let x=0;x<RW;x++){
    const cx=2*x/RW-1,rx=dx+plx*cx,ry=dy+ply*cx;
    let mx=Math.floor(ox),my=Math.floor(oy),sx,sy,sdx,sdy,side=0,hit=0;
    const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    if(rx<0){sx=-1;sdx=(ox-mx)*ddx}else{sx=1;sdx=(mx+1-ox)*ddx}
    if(ry<0){sy=-1;sdy=(oy-my)*ddy}else{sy=1;sdy=(my+1-oy)*ddy}
    for(let i=0;i<80&&!hit;i++){
      if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
      if(mx<0||my<0||mx>=N||my>=N||g[my][mx]!==0||isBlock(mx,my))hit=1;
    }
    const dist=Math.max(.05,side===0?sdx-ddx:sdy-ddy);zb[x]=dist;
    const lh=RW/dist,top=h-lh/2;
    let u=side===0?oy+dist*ry:ox+dist*rx;u-=Math.floor(u);
    const L=lightAt(mx,my,dist*Math.hypot(rx,ry))*(side?.78:1);
    for(let y=Math.max(0,Math.floor(top));y<Math.min(RW,top+lh);y++){
      const c=wallRGB(mx,my,u,(y-top)/lh);buf[y*RW+x]=px(c[0]*L,c[1]*L,c[2]*L);
    }
  }
  // sprites (enemy, nearby items, traps), far to near
  const inv=1/(plx*dy-dx*ply),tm=performance.now()/300,S=[];
  const spr=(wx,wy,Hh,Wd,lift,fn)=>{
    const rx=wx-ox,ry=wy-oy,tx=inv*(dy*rx-dx*ry),ty=inv*(-ply*rx+plx*ry);
    if(ty<.15)return;
    const lh=RW/ty,sh=lh*Hh,sw=lh*Wd,sc=RW/2*(1+tx/ty),bot=h+lh/2-lift*lh,top=bot-sh;
    const L=lightAt(Math.floor(wx),Math.floor(wy),Math.hypot(rx,ry));
    for(let x=Math.max(0,Math.floor(sc-sw/2));x<Math.min(RW,sc+sw/2);x++){
      if(ty>=zb[x])continue;const u=(x-(sc-sw/2))/sw;
      for(let y=Math.max(0,Math.floor(top));y<Math.min(RW,bot);y++){const c=fn(u,(y-top)/sh);if(c)buf[y*RW+x]=px(c[0]*L,c[1]*L,c[2]*L)}
    }
  };
  const col={key:[255,210,60],torch:[255,150,40],stun:[80,225,255],block:[180,180,180],map:[95,225,140]};
  items.forEach(it=>{if(lit(it.x,it.y)&&Math.hypot(it.x-P.fx,it.y-P.fy)<=3.2)S.push([it.x+.5,it.y+.5,.28,.28,.3+.04*Math.sin(tm+it.x),(u,v)=>Math.abs(u-.5)+Math.abs(v-.5)<.5?col[it.type]:null])});
  traps.forEach(t=>{if(lit(t.x,t.y))S.push([t.x+.5,t.y+.5,.08,.4,.02,()=>[80,225,255]])});
  if(lit(Math.round(E.fx),Math.round(E.fy))){
    const rage=E.st==='chase'||E.st==='windup',bd=rage?[205,40,40]:E.st==='stun'?[120,170,180]:[225,225,215],sh=E.st==='windup'?Math.sin(tm*40)*.03:0;
    S.push([E.fx+.5+sh,E.fy+.5,1.2,.55,0,(u,v)=>{
      const xx=Math.abs(u-.5);
      if(v<.17)return xx<.12?((v>.06&&v<.1&&xx>.03&&xx<.08)||(rage&&v>.12&&xx<.05)?[10,0,0]:bd):null;
      if(v<.62&&xx<.14)return bd;
      if(v>.2&&v<.85&&xx>.17&&xx<.22)return bd;
      if(v>=.62&&xx>.02&&xx<.11)return bd;
      return null}]);
  }
  S.sort((a,b)=>Math.hypot(b[0]-ox,b[1]-oy)-Math.hypot(a[0]-ox,a[1]-oy)).forEach(s=>spr(...s));
  octx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(oc,0,0,W,W);
  if(E.st==='windup'||E.st==='chase'){ctx.fillStyle='rgba(140,0,0,.14)';ctx.fillRect(0,0,W,W)}
  if(!P.mv&&!over&&items.some(i=>i.x===P.cx&&i.y===P.cy)){ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('Press E to pick up',W/2,W-30)}
  tail();
}

function draw() { mode === 'rel' ? draw3d() : draw2d(); }

const map = {
  e: 'use', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
  arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
  ' ': 'snap', shift: 'sprint', '1': 'stun', '2': 'block',
  r: 'restart', c: 'mode', b: 'debug'
};

addEventListener('keydown', e => {
  const k = map[e.key.toLowerCase()];
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  press(k);
});
addEventListener('keyup', e => {
  const k = map[e.key.toLowerCase()];
  if (k) release(k);
});
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => release(k)));
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  DT = dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script></body></html>
